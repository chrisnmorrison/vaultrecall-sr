name: Release

# Every push to main checks manifest.json. If its version has no GitHub
# Release yet, the plugin is built, verified, tagged, and released with
# main.js, manifest.json, and styles.css attached as assets.
on:
    push:
        branches: ["main"]
    workflow_dispatch:

permissions:
    contents: write
    # Required to sign and store build provenance attestations.
    id-token: write
    attestations: write

concurrency:
    group: release
    cancel-in-progress: false

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - name: Check out source
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Read and validate versions
              id: version
              shell: bash
              run: |
                  version=$(node -p "require('./manifest.json').version")
                  min_app=$(node -p "require('./manifest.json').minAppVersion")
                  pkg_version=$(node -p "require('./package.json').version")
                  listed_min_app=$(node -p "require('./versions.json')['${version}'] ?? ''")

                  if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                    echo "::error file=manifest.json::Version '${version}' must be x.y.z (no 'v' prefix)."
                    exit 1
                  fi
                  if [[ "${pkg_version}" != "${version}" ]]; then
                    echo "::error file=package.json::package.json version ${pkg_version} does not match manifest.json version ${version}."
                    exit 1
                  fi
                  if [[ "${listed_min_app}" != "${min_app}" ]]; then
                    echo "::error file=versions.json::versions.json must map ${version} to ${min_app} (found '${listed_min_app}')."
                    exit 1
                  fi

                  echo "version=${version}" >> "$GITHUB_OUTPUT"

            - name: Check for an existing release
              id: existing
              shell: bash
              env:
                  GH_TOKEN: ${{ github.token }}
                  VERSION: ${{ steps.version.outputs.version }}
              run: |
                  if gh release view "${VERSION}" > /dev/null 2>&1; then
                    echo "Release ${VERSION} already exists; bump the version in manifest.json to publish a new one."
                    echo "exists=true" >> "$GITHUB_OUTPUT"
                  elif tag_sha=$(git rev-parse -q --verify "refs/tags/${VERSION}^{commit}"); then
                    if [[ "${tag_sha}" != "${GITHUB_SHA}" ]]; then
                      echo "::error::Tag ${VERSION} already points at ${tag_sha}, not ${GITHUB_SHA}. Delete the tag or bump the version."
                      exit 1
                    fi
                    echo "exists=false" >> "$GITHUB_OUTPUT"
                  else
                    echo "exists=false" >> "$GITHUB_OUTPUT"
                  fi

            - name: Use Node.js
              if: steps.existing.outputs.exists == 'false'
              uses: actions/setup-node@v4
              with:
                  node-version: 22.x
                  cache: npm

            - name: Install dependencies
              if: steps.existing.outputs.exists == 'false'
              run: npm ci

            - name: Build, lint, and test
              if: steps.existing.outputs.exists == 'false'
              run: |
                  npm run build
                  npm run lint
                  npm test

            - name: Write release notes
              if: steps.existing.outputs.exists == 'false'
              shell: bash
              env:
                  VERSION: ${{ steps.version.outputs.version }}
              run: |
                  # Use the matching "## [x.y.z]" section of CHANGELOG.md.
                  awk -v ver="${VERSION}" '
                    index($0, "## [" ver "]") == 1 { found = 1; next }
                    found && /^## / { exit }
                    found { print }
                  ' CHANGELOG.md > release-notes.md
                  if [[ ! -s release-notes.md ]] || ! grep -q '[^[:space:]]' release-notes.md; then
                    echo "::error file=CHANGELOG.md::Add a '## [${VERSION}]' section to CHANGELOG.md describing this release."
                    exit 1
                  fi
                  cat release-notes.md

            - name: Attest build provenance
              if: steps.existing.outputs.exists == 'false'
              uses: actions/attest-build-provenance@v2
              with:
                  subject-path: |
                      main.js
                      manifest.json
                      styles.css

            - name: Create GitHub Release
              if: steps.existing.outputs.exists == 'false'
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ steps.version.outputs.version }}
                  target_commitish: ${{ github.sha }}
                  name: ${{ steps.version.outputs.version }}
                  body_path: release-notes.md
                  fail_on_unmatched_files: true
                  files: |
                      main.js
                      manifest.json
                      styles.css
